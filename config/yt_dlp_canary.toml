[collection]
pilot_path = "data/pilots/transcript_pilot_v1.jsonl"
pilot_manifest_path = "reports/transcript_pilot_v1_manifest.json"
output_directory = "data/transcripts/pilot_v1"
report_path = "reports/yt_dlp_canary_v1_report.json"
languages = ["en", "en-US", "en-GB"]
provider = "yt_dlp"
target_successes = 21
max_attempts_per_run = 1
minimum_request_delay_seconds = 10.0
maximum_request_delay_seconds = 15.0
max_transient_attempts_per_video = 3
stop_on_block = true
block_cooldown_seconds = 21600
