[dataset]
transcript_directory = "data/transcripts/pilot_v1"
labels_path = "data/labels/sponsor_annotations.parquet"
labels_manifest_path = "reports/sponsor_labels_manifest.json"

[model]
checkpoint_path = "checkpoints/ettin_17m_sponsor_v3_replay"
decoder_config_path = "reports/ettin_17m_replay_decoder.json"
max_length = 768
overlap_tokens = 128

[evaluation]
batch_size = 16
bf16 = true
merge_gap_characters = 24
merge_gap_ms = 1500
report_path = "reports/ettin_17m_replay_full_video_evaluation.json"
