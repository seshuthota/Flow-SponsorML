[dataset]
manifest_path = "reports/smart_segments_windows_manifest.json"
train_path = "data/training/smart_segments_windows/train.parquet"
validation_path = "data/training/smart_segments_windows/validation.parquet"
test_path = "data/training/smart_segments_windows/test.parquet"

[model]
encoder = "jhu-clsp/ettin-encoder-17m"
revision = "987607455c61e7a5bbc85f7758e0512ea6d0ae4c"
# Sponsor head initialises from the released combined checkpoint; the new heads
# start random and are trained under a higher learning rate.
initial_checkpoint = "../Flow/ml/sponsor_detection/checkpoints/ettin_17m_sponsor_combined"
categories = ["sponsor", "selfpromo", "interaction"]
max_length = 1024
dropout = 0.10

[training]
output_directory = "checkpoints/smart_segments_ettin_17m"
seed = 20260930
epochs = 2
learning_rate = 0.00001
encoder_learning_rate = 0.00001
head_learning_rate = 0.0002
weight_decay = 0.01
warmup_steps = 400
train_batch_size = 8
eval_batch_size = 16
gradient_accumulation_steps = 4
bf16 = true
preprocessing_workers = 2
eval_steps = 1000
eval_accumulation_steps = 16
save_steps = 1000
logging_steps = 50
save_total_limit = 2
