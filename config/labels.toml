[labels]
input_path = "sb-mirror/sponsorTimes.csv"
profile_path = "reports/sponsorblock_inventory.json"
output_path = "data/labels/sponsor_annotations.parquet"
manifest_path = "reports/sponsor_labels_manifest.json"
batch_size = 100000
compression = "zstd"
progress_every_rows = 5000000

[eligibility]
category = "sponsor"
service = "YouTube"
action_type = "skip"
minimum_votes = 0
exclude_hidden = true
exclude_shadow_hidden = true
duration_tolerance_seconds = 1.0
duration_tolerance_ratio = 0.01

